# Perfil por defecto requerido para la entrega. Para pruebas locales use --spring.profiles.active=h2.
spring.profiles.default=postgres

spring.main.web-application-type=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.batch.job.enabled=true

# Rutas y parámetros ajustables para las pruebas de rendimiento.
bank.batch.input-directory=${BATCH_INPUT_DIR:data}
bank.batch.output-directory=${BATCH_OUTPUT_DIR:output}
bank.batch.core-pool-size=${BATCH_CORE_POOL_SIZE:3}
bank.batch.max-pool-size=${BATCH_MAX_POOL_SIZE:3}
bank.batch.queue-capacity=${BATCH_QUEUE_CAPACITY:50}
bank.batch.grid-size=${BATCH_GRID_SIZE:3}
bank.batch.chunk-size=${BATCH_CHUNK_SIZE:50}
bank.batch.skip-limit=${BATCH_SKIP_LIMIT:2000}
bank.batch.retry-limit=${BATCH_RETRY_LIMIT:3}
bank.batch.retry-initial-interval-ms=${BATCH_RETRY_INITIAL_INTERVAL_MS:250}

logging.level.com.bank.batch=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
