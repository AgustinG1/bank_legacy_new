spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankdb}
spring.datasource.username=${DB_USERNAME:bankuser}
spring.datasource.password=${DB_PASSWORD:bankpassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# El esquema de metadatos Batch se crea mediante docker/init/01-spring-batch.sql.
spring.batch.jdbc.initialize-schema=never

